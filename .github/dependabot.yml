version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
    # Cooldown
    cooldown:
      default-days: 14
    # Group all updates into a single PR
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    commit-message:
      # Use conventional commit format as specified in user rules
      prefix: "chore(deps)"
      include: "scope"

  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    # Cooldown
    cooldown:
      default-days: 14
    # Alpen and Strata git dependencies (alpen-ee, alpen, asm, strata-common)
    # share types across crates and must be bumped together to a matched tag
    # set. Dependabot also only updates Cargo.lock without updating git tags in
    # Cargo.toml, which breaks --locked CI builds. Ignore them and bump the
    # family deliberately instead.
    ignore:
      - dependency-name: "alpen-primitives"
      - dependency-name: "strata-*"
    # Group non-security updates
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Security updates remain ungrouped for urgent handling
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
