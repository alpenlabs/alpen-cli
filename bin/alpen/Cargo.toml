[package]
name = "alpen-cli"
description = "Command-line wallet for managing Bitcoin and Alpen funds and interacting with the Strata bridge"
authors = [
  "Jose Storopoli <jose@storopoli.com>",
  "Aaron Feickert <66188213+AaronFeickert@users.noreply.github.com>",
  "Abishek Bashyal <abishek@alpenlabs.io>",
  "Ashish Thapa <ashish@alpenlabs.io>",
  "Azz <azz@alpenlabs.io>",
  "Barak Shani <35497694+barakshani@users.noreply.github.com>",
  "Dilli Raj Paudel <krsnapaudel@hotmail.com>",
  "Prajwol Gyawali <prajwol@alpenlabs.io>",
  "Pranjal Pokharel <pranjalpokharel007@gmail.com>",
  "Purushotam <purushotam@alpenlabs.io>",
  "Sapin Bajracharya <sapin@alpenlabs.io>",
  "Trey Del Bonis <trey@alpenlabs.io>",
]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm-siv.workspace = true
alloy = { workspace = true, features = ["providers"] }
alpen-bitcoin-wallet.workspace = true
alpen-wallet.workspace = true
alpen-wallet-keys.workspace = true
alpen-wallet-keystore.workspace = true
argh.workspace = true
argon2.workspace = true
bdk_bitcoind_rpc.workspace = true
bdk_wallet.workspace = true
bip39.workspace = true
colored.workspace = true
config.workspace = true
dialoguer.workspace = true
directories.workspace = true
indicatif.workspace = true
rand_core.workspace = true
serde.workspace = true
shrex.workspace = true
strata-bridge-params.workspace = true
strata-cli-common.workspace = true
strata-l1-txfmt.workspace = true
strata-primitives.workspace = true
terrors.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
async-trait.workspace = true
toml.workspace = true

[features]
test-mode = ["alpen-wallet-keys/test-mode"]

[[bin]]
name = "alpen"
path = "src/main.rs"
doc = false
