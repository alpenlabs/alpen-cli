[package]
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "alpen-cli"
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[[bin]]
name = "alpen"
path = "src/main.rs"
doc = false

[dependencies]
alpen-reth-primitives.workspace = true
strata-asm-proto-bridge-v1-txs.workspace = true
strata-bridge-params.workspace = true
strata-cli-common.workspace = true
strata-identifiers.workspace = true
strata-l1-txfmt.workspace = true
strata-ol-bridge-types.workspace = true
strata-primitives.workspace = true

aes-gcm-siv.workspace = true
alloy = { workspace = true, features = [
  "std",
  "rpc-client-ws",
  "network",
  "signers",
  "signer-local",
  "providers",
  "rpc-types",
] }
argh.workspace = true
argon2.workspace = true
async-trait.workspace = true
bdk_bitcoind_rpc.workspace = true
bdk_esplora.workspace = true
bdk_wallet = { workspace = true, features = ["rusqlite"] }
bip39.workspace = true
chrono.workspace = true
colored.workspace = true
config.workspace = true
dialoguer.workspace = true
directories.workspace = true
indicatif.workspace = true
make_buf.workspace = true
rand_core.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
sha2 = { workspace = true, features = ["loongarch64_asm"] }
shrex.workspace = true
sled.workspace = true
terrors.workspace = true
tokio.workspace = true
zeroize.workspace = true
zxcvbn.workspace = true

# sha2 fails to compile on windows with the "asm" feature
[target.'cfg(not(target_os = "windows"))'.dependencies]
sha2 = { workspace = true, features = ["asm", "loongarch64_asm"] }

# Build SQLite from source when producing the static Linux release binary.
[target.'cfg(target_env = "musl")'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
strata-bridge-params.workspace = true
strata-test-utils-btcio.workspace = true
toml.workspace = true

[features]
test-mode = []
